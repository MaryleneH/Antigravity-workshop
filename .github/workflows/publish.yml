on:
  push:
    branches: main
  pull_request:
    branches: main

name: Render and Publish

jobs:
  # Contrôles automatiques (images, vidéos et liens internes qui doivent exister ;
  # images trop lourdes signalées). Voir _scripts/verifier_site.py.
  # Lancés sur chaque pull request ET avant chaque publication.
  check:
    name: Contrôles du site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Vérifier les images et les liens internes
        run: python3 _scripts/verifier_site.py

  build-deploy:
    # Publication uniquement si les contrôles passent, et seulement depuis main (pas sur les PR).
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
