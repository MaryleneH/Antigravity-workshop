on:
  push:
    branches: main
  pull_request:
    branches: main

name: Render and Publish

jobs:
  # Contrôles automatiques (images, vidéos et liens internes qui doivent exister ;
  # images trop lourdes signalées). Voir _scripts/verifier_site.py.
  # Lancés sur chaque pull request ET avant chaque publication.
  check:
    name: Contrôles du site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v7 : fonctionne sous Node 24 (Node 20 n'est plus pris en charge)
        with:
          # Ce contrôle ne fait que lire les fichiers : inutile de laisser le jeton d'accès sur le disque.
          persist-credentials: false

      - name: Vérifier les images et les liens internes
        run: python3 _scripts/verifier_site.py

  build-deploy:
    # Publication uniquement si les contrôles passent, et seulement depuis main (pas sur les PR).
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # La publication pousse le site sur la branche gh-pages depuis un « worktree » git :
          # elle a besoin des identifiants conservés par checkout. Écrit explicitement pour ne pas
          # dépendre d'un éventuel changement de valeur par défaut dans une future version.
          persist-credentials: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
