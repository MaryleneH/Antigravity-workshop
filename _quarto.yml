project:
  type: website
  output-dir: docs

website:
  title: "Mo Gadarr"
  navbar:
    title: false
    left:
      - text: "MG" # Monogram Logo
        href: index.qmd
      - text: "Romans"
        href: romans.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Contact"
        href: contact.qmd
  page-footer:
    center: "© 2026 Mo Gadarr. Tous droits réservés."

lang: fr

format:
  html:
    theme:
      dark: [darkly, styles.css, styles-dark.css]
      light: [cosmo, styles.css, styles-light.css]
    mainfont: 'Lato'
    fontsize: 1.1em
    include-in-header:
      text: |
        <script>
        /* Force default to dark mode - Migration V1 */
        (function() {
            const storageKey = 'quarto-color-scheme';
            const migrationKey = 'quarto-dark-mode-v1';
            
            // Check if we have migrated this user to dark mode yet
            if (!window.localStorage.getItem(migrationKey)) {
                // Force Dark Mode
                window.localStorage.setItem(storageKey, 'dark');
                // Mark as migrated so we don't do it again
                window.localStorage.setItem(migrationKey, 'true');
            }
        })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
