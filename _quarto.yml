project:
  type: website
  output-dir: docs

website:
  title: "Mo Gadarr"
  navbar:
    title: false
    left:
      - text: "MG" # Monogram Logo
        href: index.qmd
      - text: "Accueil"
        href: index.qmd
      - text: "Romans"
        href: romans.qmd
      - text: "Dernier roman"
        href: dernier_roman/prends_buche.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Contact"
        href: contact.qmd
  page-footer:
    center: "© 2026 Mo Gadarr. Tous droits réservés."

lang: fr

format:
  html:
    theme:
      light: [cosmo, styles.css, styles-light.css]
      dark: [darkly, styles.css, styles-dark.css]
    mainfont: 'Lato'
    fontsize: 1.1em
    include-in-header:
      text: |
        <script>
        /* Force default to dark mode - Migration V2 */
        (function() {
            const storageKey = 'quarto-color-scheme';
            const migrationKey = 'quarto-dark-mode-v2';
            
            // Re-run migration for V2 to sync toggle button
            if (!window.localStorage.getItem(migrationKey)) {
                // Force Alternate (Dark)
                window.localStorage.setItem(storageKey, 'alternate');
                // Mark as migrated
                window.localStorage.setItem(migrationKey, 'true');
            }
        })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
