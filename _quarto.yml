project:
  type: website
  output-dir: docs
  resources:
    # Domaine personnalisé : sans ce fichier dans le rendu, chaque publication
    # sur gh-pages supprimait CNAME et mogadarr.fr cessait de pointer vers le site.
    - "CNAME"
    - "images/prends-buche-art.webp"
    - "images/partage/*"
    - "images/filtre-noel/*"
    - "images/cocon/*"

website:
  title: "Mo Gadarr"
  description: "Site officiel de Mo Gadarr, auteure de romance engagée — romans, nouveautés, événements."
  site-url: https://mogadarr.fr
  # Aperçus lors des partages (Facebook, WhatsApp, X…) : image par défaut,
  # remplacée sur chaque page par son propre champ `image:`.
  image: images/partage/fille-pere-noel-og.jpg
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  favicon: assets/favicon.png
  navbar:
    title: "Mo Gadarr"
    logo: images/cocon/logo-mo-192.webp
    logo-alt: ""
    pinned: true
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Dernier roman"
        href: dernier_roman/fille_pere_noel.qmd
      - text: "Romans"
        href: romans.qmd
      - text: "L'Auteure"
        href: about.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Contact"
        href: contactons.qmd
    right:
      - icon: heart-fill
        text: "Le Cercle des Intimes"
        href: index.qmd#lettre

lang: fr

format:
  html:
    # Thème « Cocon » (clair) : couleurs, polices, menu et composants dans styles/cocon.scss ;
    # pages de livres, extraits, blog et articles dans styles/cocon-pages.scss.
    theme:
      - cosmo
      - styles/cocon.scss
      - styles/cocon-pages.scss
    mainfont: "Figtree"
    include-in-header:
      - file: _includes/head-icons.html
    include-before-body:
      - file: _includes/icones.html
    include-after-body:
      - file: _includes/pied-de-page.html
